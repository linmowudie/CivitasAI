# Civitas-AI 服务端本地依赖：PostgreSQL
#
# 用法：
#   docker compose up -d db          # 启动数据库
#   docker compose logs -f db        # 查看日志
#   docker compose down              # 停止（保留数据卷）
#   docker compose down -v           # 停止并删除数据（谨慎）
#
# 服务端连接串（默认值，勿用于生产）：
#   postgres://civitas:civitas@127.0.0.1:5432/civitas_server

services:
  db:
    image: postgres:16-alpine
    container_name: civitas-server-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: civitas
      POSTGRES_PASSWORD: civitas
      POSTGRES_DB: civitas_server
      # 中文统计/检索需要 UTF8（alpine 镜像默认已是 UTF8，此处显式声明）
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - civitas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civitas -d civitas_server"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  civitas_pgdata:
